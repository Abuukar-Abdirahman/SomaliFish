<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Badda Maanta — SomaliFish AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --safe:#1a9850; --caution:#fee08b; --danger:#d73027; --unknown:#999;
    --bg:#0b1f2a; --panel:#112b38; --ink:#eaf2f6; --muted:#9fb4c0;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
              background:var(--bg); color:var(--ink); }
  #map { position:absolute; inset:0; background:#08161e; }

  .banner {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    padding:10px 14px; display:flex; align-items:center; gap:12px;
    font-weight:700; color:#111; box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .banner.AMMAAN   { background:var(--safe);    color:#fff; }
  .banner.TAXADDAR { background:var(--caution); color:#111; }
  .banner.KHATAR   { background:var(--danger);  color:#fff; }
  .banner.LAMA_OGA { background:var(--unknown); color:#fff; }
  .banner .so { font-size:1.15rem; }
  .banner .en { font-weight:400; opacity:.9; font-size:.85rem; }

  .panel {
    position:absolute; z-index:1000; background:var(--panel);
    border:1px solid rgba(255,255,255,.09); border-radius:10px;
    padding:12px 14px; font-size:.85rem; line-height:1.5;
    box-shadow:0 6px 22px rgba(0,0,0,.45);
  }
  /* Left column belongs entirely to the zone list - it is the primary
     output. Legend and detail share the right column. */
  #legend { right:12px; bottom:30px; width:265px; }
  #info   { right:12px; top:70px; width:265px; }
  #zones  { left:12px; top:70px; width:300px; max-height:calc(100vh - 92px);
            overflow-y:auto; }

  .zone { display:flex; gap:9px; align-items:flex-start; padding:7px 6px;
          border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .zone:hover { background:rgba(255,255,255,.06); }
  .zone.active { background:rgba(74,168,200,.18); border-color:#4aa8c8; }
  .zone .rank { font-weight:700; width:19px; text-align:right; color:var(--muted);
                flex:none; padding-top:1px; }
  .zone .body { flex:1; min-width:0; }
  .zone .nm { font-weight:600; }
  .zone .sub { font-size:.74rem; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block;
         margin-right:5px; vertical-align:0px; flex:none; }
  .pill { font-size:.68rem; padding:1px 6px; border-radius:20px;
          background:rgba(255,255,255,.1); color:var(--ink); }

  @media (max-width:900px){
    /* On a phone the zone list is the whole point: give it the bottom sheet
       and drop the legend, which is explanatory rather than actionable. */
    #zones { position:absolute; left:8px; right:8px; width:auto; top:auto;
             bottom:8px; max-height:44vh; }
    #info  { right:8px; left:8px; width:auto; top:64px; }
    #legend { display:none; }
  }
  h3 { margin:0 0 8px; font-size:.9rem; letter-spacing:.02em; }
  .row { display:flex; justify-content:space-between; gap:10px; }
  .row span:last-child { color:var(--muted); }
  .swatch { display:inline-block; width:14px; height:14px; border-radius:3px;
            margin-right:7px; vertical-align:-2px; }
  .note { color:var(--muted); font-size:.72rem; margin-top:9px;
          border-top:1px solid rgba(255,255,255,.09); padding-top:8px; }
  .warn { background:#3a2a12; border:1px solid #7a5a20; color:#f5d9a0;
          padding:8px 10px; border-radius:8px; font-size:.75rem; margin-top:9px; }
  button { background:#1d4152; color:var(--ink); border:1px solid rgba(255,255,255,.15);
           border-radius:7px; padding:5px 9px; font-size:.75rem; cursor:pointer; }
  button:hover { background:#265065; }
  button[aria-pressed="true"] { background:#2e7d9a; border-color:#4aa8c8; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }

  /* Zone labels are DOM, not canvas: they stay crisp at every zoom level.
     Text shadow rather than a box keeps the data underneath visible. */
  .zone-label {
    white-space:nowrap; font-weight:600; color:#fff; pointer-events:none;
    text-shadow:0 0 3px #000, 0 0 6px #000, 0 1px 2px #000;
    transform:translate(-50%,-50%); width:max-content;
    letter-spacing:.01em;
  }
  .zone-label .zl-rank {
    display:inline-block; min-width:1.1em; margin-right:4px; padding:0 3px;
    background:rgba(0,0,0,.55); border-radius:3px; text-align:center;
  }
  .leaflet-marker-icon.zone-label { background:none; border:none; }
</style>
</head>
<body>

<div id="banner" class="banner LAMA_OGA">
  <div style="flex:1">
    <div class="so" id="banner-so">Waa la soo dejinayaa…</div>
    <div class="en" id="banner-en">Loading sea conditions…</div>
  </div>
  <div id="banner-date" style="font-size:.78rem;opacity:.85"></div>
</div>

<div id="map"></div>

<div id="zones" class="panel">
  <h3 style="display:flex;justify-content:space-between;align-items:center">
    <span>Aagagga kalluumaysiga</span>
    <span class="pill" id="zone-count"></span>
  </h3>
  <div style="font-size:.72rem;color:var(--muted);margin:-4px 0 8px">
    Fishing zones a small boat can reach today
  </div>
  <div id="zone-list"></div>
  <div class="note" id="zone-source"></div>
</div>

<div id="legend" class="panel">
  <div class="tabs">
    <button id="tab-safety"  aria-pressed="true">Ammaan</button>
    <button id="tab-score"   aria-pressed="false">Rajo</button>
    <button id="tab-sst"     aria-pressed="false">Heerkulka</button>
    <button id="tab-chl"     aria-pressed="false">Cagaaran</button>
  </div>
  <div id="legend-body"></div>
  <div class="note" id="legend-note"></div>
</div>

<div id="info" class="panel">
  <h3>Riix badda / Tap the sea</h3>
  <div id="info-body" style="color:var(--muted)">
    Riix meel badda ah si aad u aragto xaaladda.<br>
    <span style="font-size:.75rem">Tap anywhere at sea for local conditions.</span>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SAFETY_COLORS = { AMMAAN:'#1a9850', TAXADDAR:'#fee08b', KHATAR:'#d73027', LAMA_OGA:'#999999' };
const SAFETY_SO = { AMMAAN:'Ammaan', TAXADDAR:'Taxaddar', KHATAR:'Khatar', LAMA_OGA:'Lama oga' };
const SAFETY_EN = { AMMAAN:'Safe', TAXADDAR:'Caution', KHATAR:'Dangerous', LAMA_OGA:'Unknown' };

let DATA = null, MODE = 'safety';

// Zoom control bottom-right: top-left would sit on top of the safety banner,
// which must never be obscured.
// Max zoom 10. The data is 0.1 deg (~11 km); past this the map would imply a
// precision the satellites never gave us, so we stop rather than invent it.
const MAX_ZOOM = 10;
const map = L.map('map', { zoomControl:false, attributionControl:true,
                           maxZoom:MAX_ZOOM, minZoom:4, zoomSnap:0.5 })
             .setView([6.5, 49.5], 6);
L.control.zoom({ position:'bottomright' }).addTo(map);
// Base geography WITHOUT place names, so the data layer sits on clean ground.
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO | Ocean data: Copernicus Marine ' +
              '(0.1&deg; ~11 km grid)',
  maxZoom:MAX_ZOOM, minZoom:4
}).addTo(map);

// Coastline and place names drawn back ON TOP of the interpolated data, in
// their own pane. Without this the smooth raster swallows the coast and you
// cannot tell where the land is.
map.createPane('labels');
map.getPane('labels').style.zIndex = 450;
map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  maxZoom:MAX_ZOOM, minZoom:4, pane:'labels', opacity:0.9
}).addTo(map);

// ---------------------------------------------------------------- rendering
//
// Data is rasterised ONCE into a small offscreen canvas at native grid size
// (145 x 120), then drawn scaled onto the display canvas with image smoothing
// on. The browser's own bilinear scaler does the interpolation, so zoomed-in
// views show gradients instead of 11 km squares - for the cost of a single
// drawImage call per frame. That keeps it fast on a cheap phone: no
// per-cell loop at render time, no libraries.
//
// The raster is for LOOKING at. Every number the user is told - the tap
// popup, the zone panel - comes from the API's true per-cell values, never
// from an interpolated pixel.

let RASTER = null, RASTER_MODE = null;

function buildRaster(){
  if (!DATA) return null;
  const g = DATA.grid, cells = DATA.cells;
  const nLat = g.n_lat, nLon = g.n_lon;
  const off = document.createElement('canvas');
  off.width = nLon; off.height = nLat;
  const ctx = off.getContext('2d');
  const img = ctx.createImageData(nLon, nLat);
  const px = img.data;

  const dangerous = DATA.safety && DATA.safety.share_dangerous > 0.15;
  const baseAlpha = (MODE === 'score' && dangerous) ? 0.35 : 0.78;

  for (let i = 0; i < cells.lat.length; i++){
    const col = colorFor(cells, i);
    if (!col) continue;
    const rgb = parseColor(col);
    if (!rgb) continue;
    // Grid row 0 is the southernmost latitude; canvas row 0 is the top
    // (northernmost), so the vertical axis is flipped.
    const row = nLat - 1 - cells.lat_idx[i];
    const o = (row * nLon + cells.lon_idx[i]) * 4;
    px[o] = rgb[0]; px[o+1] = rgb[1]; px[o+2] = rgb[2];
    px[o+3] = Math.round(255 * baseAlpha * (rgb[3] === undefined ? 1 : rgb[3]));
  }
  ctx.putImageData(img, 0, 0);
  return off;
}

function parseColor(c){
  if (c[0] === '#') return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const m = c.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/);
  return m ? [ +m[1], +m[2], +m[3], m[4] === undefined ? 1 : +m[4] ] : null;
}

const CellLayer = L.Layer.extend({
  onAdd(m){
    this._map = m;
    this._canvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated');
    this._canvas.style.pointerEvents = 'none';
    m.getPanes().overlayPane.appendChild(this._canvas);
    m.on('moveend zoomend resize', this._render, this);
    if (m.options.zoomAnimation) m.on('zoomanim', this._animateZoom, this);
    this._render();
  },
  onRemove(m){
    L.DomUtil.remove(this._canvas);
    m.off('moveend zoomend resize', this._render, this);
    m.off('zoomanim', this._animateZoom, this);
  },
  _animateZoom(e){
    // Scale the existing bitmap during the zoom animation so it tracks the
    // basemap instead of jumping at the end.
    const m = this._map;
    const scale = m.getZoomScale(e.zoom);
    const offset = m._latLngToNewLayerPoint(
      m.containerPointToLatLng([0, 0]), e.zoom, e.center);
    L.DomUtil.setTransform(this._canvas, offset, scale);
  },
  redraw(){ RASTER = null; this._render(); },
  _render(){
    if (!DATA) return;
    const m = this._map, size = m.getSize(), c = this._canvas;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap for cheap GPUs

    L.DomUtil.setTransform(c, m.containerPointToLayerPoint([0, 0]), 1);
    c.width = Math.round(size.x * dpr);
    c.height = Math.round(size.y * dpr);
    c.style.width = size.x + 'px';
    c.style.height = size.y + 'px';

    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size.x, size.y);

    if (RASTER_MODE !== MODE || !RASTER){
      RASTER = buildRaster();
      RASTER_MODE = MODE;
    }
    if (!RASTER) return;

    const g = DATA.grid;
    const nw = m.latLngToContainerPoint([g.lat_max, g.lon_min]);
    const se = m.latLngToContainerPoint([g.lat_min, g.lon_max]);

    // This is the whole interpolation step: one smoothed blit.
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(RASTER, nw.x, nw.y, se.x - nw.x, se.y - nw.y);
  }
});
const cellLayer = new CellLayer().addTo(map);

function colorFor(cells, i){
  // Outside artisanal range: draw faint grey so the sea is still visible but
  // clearly not being recommended. Never colour it as an opportunity.
  if (MODE !== 'safety' && cells.reachable && !cells.reachable[i])
    return 'rgba(120,140,150,0.13)';
  if (MODE === 'score'){
    const v = cells.score ? cells.score[i] : null; if (v == null) return null;
    return ramp(v, 20, 95, ['#08306b','#2166ac','#4393c3','#fddbc7','#f4a582','#d6604d']);
  }
  if (MODE === 'safety') return SAFETY_COLORS[cells.safety[i]] || null;
  if (MODE === 'sst'){
    const v = cells.sst[i]; if (v == null) return null;
    return ramp(v, 22, 32, ['#2b83ba','#abdda4','#ffffbf','#fdae61','#d7191c']);
  }
  if (MODE === 'chl'){
    const v = cells.chl[i]; if (v == null) return null;
    return ramp(Math.log10(Math.max(v,0.02)), -1.4, 0.6,
                ['#08306b','#2171b5','#41ab5d','#a1d99b','#ffffcc']);
  }
  return null;
}
function ramp(v, lo, hi, stops){
  const t = Math.max(0, Math.min(1, (v-lo)/(hi-lo)));
  const x = t*(stops.length-1), i = Math.floor(x), f = x-i;
  const a = hex(stops[i]), b = hex(stops[Math.min(i+1, stops.length-1)]);
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}
function hex(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

const MODES = ['safety','score','sst','chl'];
function setMode(mode){
  MODE = mode;
  for (const m of MODES)
    document.getElementById('tab-'+m).setAttribute('aria-pressed', String(m===mode));
  drawLegend(); cellLayer.redraw();
}
for (const m of MODES)
  document.getElementById('tab-'+m).onclick = ()=>setMode(m);

function drawLegend(){
  const body = document.getElementById('legend-body');
  const note = document.getElementById('legend-note');
  if (MODE === 'score'){
    body.innerHTML = gradientBar(['#08306b','#2166ac','#4393c3','#fddbc7','#f4a582','#d6604d'],
                                 'Rajo yar', 'Rajo fiican');
    const m = DATA ? DATA.model : null;
    note.innerHTML = m
      ? `<b>${m.label_so}</b><br><span style="opacity:.85">${m.label_en}</span>`
        + (m.trained ? '' :
           `<div class="warn">${m.note_so}<br><span style="opacity:.8">${m.note_en}</span></div>`)
      : '';
    return;
  }
  if (MODE === 'safety'){
    const t = DATA ? DATA.thresholds : null;
    body.innerHTML = ['AMMAAN','TAXADDAR','KHATAR'].map(k =>
      `<div><span class="swatch" style="background:${SAFETY_COLORS[k]}"></span>
       <b>${SAFETY_SO[k]}</b> <span style="color:var(--muted)">${SAFETY_EN[k]}</span></div>`).join('');
    note.innerHTML = t
      ? `Hirarka &lt; ${t.wave_safe_m} m iyo dabaysha &lt; ${t.wind_safe_kmh} km/saac = ammaan.<br>
         Waves &amp; wind, daily maximum.`
      : '';
  } else if (MODE === 'sst'){
    body.innerHTML = gradientBar(['#2b83ba','#abdda4','#ffffbf','#fdae61','#d7191c'], '22°C', '32°C');
    note.textContent = 'Heerkulka badda / Sea surface temperature. Cold water = upwelling.';
  } else {
    body.innerHTML = gradientBar(['#08306b','#2171b5','#41ab5d','#a1d99b','#ffffcc'], 'low', 'high');
    note.textContent = 'Cagaaran (chlorophyll) — plankton, cuntada kalluunka / the base of the food chain.';
  }
}
function gradientBar(stops, lo, hi){
  return `<div style="height:12px;border-radius:4px;background:linear-gradient(to right,${stops.join(',')})"></div>
          <div class="row" style="margin-top:4px"><span>${lo}</span><span>${hi}</span></div>`;
}

function setBanner(p){
  const s = p.safety || {}, st = s.status || 'LAMA_OGA';
  const b = document.getElementById('banner');
  b.className = 'banner ' + st;
  document.getElementById('banner-so').textContent =
    (s.advice && s.advice.so) || SAFETY_SO[st];
  document.getElementById('banner-en').textContent =
    (s.advice && s.advice.en) || SAFETY_EN[st];
  let d = p.date;
  if (p.source === 'demo' || p.stale) d += ' — xog kaydsan / cached demo data';
  document.getElementById('banner-date').textContent = d;
}

// IMPORTANT: this asks the API for the nearest real grid cell. It must never
// be reimplemented by sampling the canvas - those pixels are interpolated for
// display, and a blended safety colour between a safe cell and a dangerous
// one is not a real reading of either.
map.on('click', async (e) => {
  const {lat, lng} = e.latlng;
  const box = document.getElementById('info-body');
  box.innerHTML = '<span style="color:var(--muted)">…</span>';
  try {
    const r = await fetch(`/api/zone/${lat.toFixed(3)}/${lng.toFixed(3)}`);
    if (!r.ok) { box.innerHTML = '<span style="color:var(--muted)">Ma jirto xog halkan (dhulka?)<br>No ocean data here.</span>'; return; }
    const z = await r.json(), c = z.conditions || {};
    const st = z.safety.status;
    const rows = [
      ['Ammaanka / Safety', `<b style="color:${SAFETY_COLORS[st]}">${SAFETY_SO[st]}</b>`],
      ['Heerkulka / SST', c.sst != null ? c.sst.toFixed(1)+' °C' : '—'],
      ['Cagaaran / Chl', c.chl != null ? c.chl.toFixed(2)+' mg/m³' : '—'],
      ['Hirarka / Waves', c.wave_height_max != null ? c.wave_height_max.toFixed(1)+' m' : '—'],
      ['Dabaysha / Wind', c.wind_speed_max != null ? Math.round(c.wind_speed_max)+' km/saac' : '—'],
      ['Socodka / Current', c.current_speed != null ? c.current_speed.toFixed(2)+' m/s' : '—'],
    ];
    if (z.fishing_potential != null)
      rows.unshift(['Rajada kalluunka / Potential', `<b>${z.fishing_potential}/100</b>`]);
    box.innerHTML = `<div style="margin-bottom:6px;color:var(--muted)">${z.lat.toFixed(2)}°, ${z.lon.toFixed(2)}°</div>`
      + rows.map(([k,v])=>`<div class="row"><span>${k}</span><span style="color:var(--ink)">${v}</span></div>`).join('')
      + (z.model && z.model.trained === false
          ? `<div class="warn">Ma jiro model tababaran weli — tani waa xaaladda badda oo kaliya.<br>
             <span style="opacity:.8">No trained model yet — showing measured conditions only, no fishing prediction.</span></div>`
          : '');
  } catch (err) {
    box.innerHTML = '<span style="color:var(--muted)">Khalad / error</span>';
  }
});

// ---------------------------------------------------------------- zone list
let ZONE_MARKERS = [], ACTIVE_ZONE = null;

function renderZones(){
  const list = document.getElementById('zone-list');
  const zones = (DATA && DATA.zones) || [];
  document.getElementById('zone-count').textContent = zones.length;

  if (!zones.length){
    list.innerHTML = '<div style="color:var(--muted);font-size:.8rem">Ma jiro aag la gaari karo maanta.<br>No reachable zone today.</div>';
    return;
  }
  list.innerHTML = zones.map(z => `
    <div class="zone" data-zone="${z.zone_id}">
      <div class="rank">${z.rank}</div>
      <div class="body">
        <div class="nm"><span class="dot" style="background:${SAFETY_COLORS[z.safety]}"></span>${z.name_so}</div>
        <div class="sub">${z.rating.so} · ${z.score ?? '—'}/100 · ${z.distance_km} km · ${z.travel_hours} sc</div>
        <div class="sub" style="opacity:.75">${z.name_en} — ${SAFETY_EN[z.safety]}</div>
      </div>
    </div>`).join('');

  for (const el of list.querySelectorAll('.zone'))
    el.onclick = () => selectZone(el.dataset.zone);

  const src = DATA.model || {};
  const reach = DATA.reach || {};
  document.getElementById('zone-source').innerHTML =
    `Kala sooc: <b>${src.trained ? 'model tababaran' : 'tilmaame cabbiran'}</b>`
    + `<br><span style="opacity:.8">Ranked by ${src.trained ? 'the trained model' : 'measured chlorophyll + temperature fronts'}.</span>`
    + `<br><span style="opacity:.8">Only water within ${reach.max_coast_km ?? '—'} km of shore and `
    + `${reach.max_trip_km ?? '—'} km of a landing site is ranked `
    + `(${reach.n_reachable_cells ?? 0} of ${reach.n_cells_total ?? 0} cells).</span>`;
}

// Zone outlines and labels are Leaflet vectors / DOM, NOT part of the raster,
// so they stay razor sharp at every zoom while the data underneath blends.
let ZONE_OUTLINES = null, ZONE_LABELS = null, SELECTED_OUTLINE = null;

function drawZoneVectors(){
  if (ZONE_OUTLINES) map.removeLayer(ZONE_OUTLINES);
  if (ZONE_LABELS) map.removeLayer(ZONE_LABELS);
  ZONE_OUTLINES = L.layerGroup();
  ZONE_LABELS = L.layerGroup();

  for (const z of (DATA.zones || [])){
    const b = z.bounds;
    if (!b) continue;
    const rect = L.rectangle(
      [[b.lat_min, b.lon_min], [b.lat_max, b.lon_max]],
      { color: SAFETY_COLORS[z.safety], weight: 1, opacity: 0.55,
        fill: false, dashArray: '3,3', interactive: false });
    rect.addTo(ZONE_OUTLINES);

    const label = L.marker([z.centre.lat, z.centre.lon], {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'zone-label', html:
        `<span class="zl-rank">${z.rank}</span>${z.name_so}`, iconSize: null })
    });
    label._zoneRank = z.rank;
    label.addTo(ZONE_LABELS);
  }
  ZONE_OUTLINES.addTo(map);
  ZONE_LABELS.addTo(map);
  styleLabelsForZoom();
}

function styleLabelsForZoom(){
  // Labels grow with zoom so they stay readable, and thin out when zoomed
  // far back so the coast is not buried under 36 overlapping names.
  const z = map.getZoom();
  const size = Math.max(9, Math.min(15, 9 + (z - 6) * 1.6));
  const maxRank = z <= 6 ? 5 : (z <= 7 ? 12 : (z <= 8 ? 24 : 99));
  for (const el of document.querySelectorAll('.zone-label')){
    el.style.fontSize = size.toFixed(1) + 'px';
  }
  if (!ZONE_LABELS) return;
  ZONE_LABELS.eachLayer(l => {
    const el = l.getElement && l.getElement();
    if (el) el.style.display = (l._zoneRank <= maxRank) ? '' : 'none';
  });
}
map.on('zoomend', styleLabelsForZoom);

function selectZone(zoneId){
  const z = (DATA.zones || []).find(x => x.zone_id === zoneId);
  if (!z) return;
  ACTIVE_ZONE = zoneId;
  for (const el of document.querySelectorAll('.zone'))
    el.classList.toggle('active', el.dataset.zone === zoneId);

  if (SELECTED_OUTLINE) map.removeLayer(SELECTED_OUTLINE);
  if (z.bounds){
    const b = z.bounds;
    SELECTED_OUTLINE = L.rectangle(
      [[b.lat_min, b.lon_min], [b.lat_max, b.lon_max]],
      { color: '#ffffff', weight: 2.5, opacity: 0.95, fill: true,
        fillColor: '#ffffff', fillOpacity: 0.08, interactive: false }).addTo(map);
    map.flyToBounds(SELECTED_OUTLINE.getBounds(), {
      duration: 0.6, maxZoom: 9, padding: [80, 80] });
  } else {
    map.flyTo([z.centre.lat, z.centre.lon], 8, { duration: 0.6 });
  }
  showZoneDetail(z);
}

function showZoneDetail(z){
  const c = z.conditions || {};
  const rows = [
    ['Rajada / Potential', `<b>${z.score ?? '—'}/100</b> ${z.rating.so}`],
    ['Ammaanka / Safety', `<b style="color:${SAFETY_COLORS[z.safety]}">${SAFETY_SO[z.safety]}</b>`],
    ['Fogaanta / Distance', `${z.distance_km} km`],
    ['Waqtiga / Travel', `~${z.travel_hours} saacadood`],
    ['Heerkulka / SST', c.sst != null ? c.sst.toFixed(1)+' °C' : '—'],
    ['Cagaaran / Chl', c.chl != null ? c.chl.toFixed(2)+' mg/m³' : '—'],
    ['Hirarka / Waves', c.wave_height_max != null ? c.wave_height_max.toFixed(1)+' m' : '—'],
    ['Dabaysha / Wind', c.wind_speed_max != null ? Math.round(c.wind_speed_max)+' km/saac' : '—'],
  ];
  document.getElementById('info').querySelector('h3').textContent =
    `${z.rank}. ${z.name_so}`;
  document.getElementById('info-body').innerHTML =
    `<div style="margin-bottom:6px;color:var(--muted)">${z.name_en} · ka soo ${z.site.so}</div>`
    + rows.map(([k,v])=>`<div class="row"><span>${k}</span><span style="color:var(--ink)">${v}</span></div>`).join('')
    + (z.safety === 'KHATAR'
        ? `<div class="warn" style="background:#4a1b1b;border-color:#8a3030;color:#ffc9c9">
           KHATAR: Ha bixin badda maanta, in kastoo rajada kalluunka wanaagsan tahay.<br>
           <span style="opacity:.85">Dangerous — do not go, even though the fishing looks good.</span></div>`
        : '')
    + (z.wave_estimated_share > 0.3
        ? `<div class="warn">Xogta hirarka waxaa laga qiyaasay unug u dhow.<br>
           <span style="opacity:.8">Wave height estimated from a nearby cell (${Math.round(z.wave_estimated_share*100)}% of this zone).</span></div>`
        : '');
}

function addLandingSites(){
  for (const m of ZONE_MARKERS) map.removeLayer(m);
  ZONE_MARKERS = [];
  const seen = new Set();
  for (const z of (DATA.zones || [])){
    if (seen.has(z.site.id)) continue;
    seen.add(z.site.id);
    const mk = L.circleMarker([z.site.lat, z.site.lon], {
      radius:4, color:'#ffffff', weight:1.5, fillColor:'#111', fillOpacity:.85
    }).addTo(map).bindTooltip(`${z.site.so} / ${z.site.en}`, {direction:'top'});
    ZONE_MARKERS.push(mk);
  }
}

(async function init(){
  try {
    const r = await fetch('/api/today');
    if (!r.ok) throw new Error('no data');
    DATA = await r.json();
    if (DATA.grid && DATA.grid.max_useful_zoom)
      map.setMaxZoom(DATA.grid.max_useful_zoom);
    setBanner(DATA);
    renderZones();
    drawZoneVectors();
    addLandingSites();
    drawLegend();
    // Leaflet caches the container size at construction. If the page was
    // still laying out (or the tab was in the background) it caches 0x0 and
    // the overlay never draws. Re-measure before the first paint.
    map.invalidateSize();
    cellLayer.redraw();
  } catch (e) {
    document.getElementById('banner-so').textContent = 'Xogta lama helin';
    document.getElementById('banner-en').textContent = 'Could not load data — is the API running?';
  }
})();

// Phones fire late layout changes (address bar collapsing, rotation). Keep
// the map's cached size honest, or the overlay silently stops matching.
window.addEventListener('load', () => { map.invalidateSize(); cellLayer.redraw(); });
window.addEventListener('orientationchange',
  () => setTimeout(() => { map.invalidateSize(); cellLayer.redraw(); }, 200));
</script>
</body>
</html>
